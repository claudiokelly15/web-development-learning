<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master User Profile</title>
  </head>
  <body>
    <div
      style="
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
        font-family: sans-serif;
      "
    >
      <h1>Account & Profile Registration</h1>
      <p>Please fill out this form to complete your personal profile setup.</p>
      <form method="post" enctype="multipart/form-data">
        <fieldset>
          <label for="name">full name</label>
          <input type="text" id="name" name="name" required /><br /><br />
          <label for="phone">phone number:</label>
          <input type="tel" id="phone" name="phone" required /><br /><br />
          <label for="address">user address:</label>
          <input type="text" id="address" name="address" required /><br /><br />
          <label for="country">country:</label>
          <select id="country" name="country" required>
            <option value="tz">Tanzania</option>
            <option value="ke">Kenya</option>
            <option value="ug">Uganda</option>
          </select>
          <br />
        </fieldset>
        <fieldset>
          <legend><b>Account Security (Login Details)</b></legend>
          <p>
            <label for="email">Email Address:</label><br />
            <input
              type="email"
              id="email"
              name="user_email"
              placeholder="example@gmail.com"
              required
            />
          </p>
          <p>
            <label for="password">Password:</label><br />
            <input
              type="password"
              id="password"
              name="user_password"
              placeholder="Enter your password"
              required
            />
          </p>
          <p>
            <label for="confirm_password">Confirm Password:</label><br />
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              placeholder="Enter your password"
              required
            />
          </p>
        </fieldset>
        <br />
        <fieldset>
          <legend><b>Personal Information (Date Selection)</b></legend>
          <p>
            <label for="gender">Gender:</label><br />
            <select id="gender" name="user_gender" required>
              <option value="">Select Gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </p>
          <p>
            <label for="birthdate">Date of Birth:</label><br />
            <input type="date" id="birthdate" name="user_birthdate" required />
          </p>
        </fieldset>
        <br />
        <fieldset>
          <legend><b>Document & Media upload</b></legend>
          <p>
            <label for="profile_pic">Upload Profile Picture (image only):</label
            ><br />
            <input
              type="file"
              id="profile_pic"
              name="profile_image"
              accept="image/*"
            />
          </p>
          <p>
            <label for="document">upload ID Documment (PDF or Word only):</label
            ><br />
            <input
              type="file"
              id="document"
              name="user_document"
              accept=".pdf, .doc, .docx"
              required
            />
          </p>
        </fieldset>
        <br />
        <br />
        <p for="terms">
          <input type="checkbox" id="terms" name="terms_accepted" required />
          <label for="terms">I agree to the terms and conditions</label>
        </p>
        <p>
          <button type="submit">Save Master Profile</button>
        </p>
      </form>
    </div>
  </body>
</html>
